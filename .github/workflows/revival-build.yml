name: SayanVPN Revival Build

run-name: SayanVPN ARM64 candidate · ${{ github.sha }}

on:
  push:
    branches:
      - revival/arm64-build-2026-11-05
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sayanvpn-revival-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and package ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Run Android lint
        run: ./gradlew lint --stacktrace

      - name: Build ARM64 APK
        run: ./gradlew assembleDebug -PautovpnAbi=arm64-v8a --stacktrace

      - name: Verify APK and create checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          "$build_tools/apksigner" verify --verbose "$apk"
          mkdir -p build/revival
          cp "$apk" build/revival/SayanVPN-arm64-debug.apk
          (cd build/revival && sha256sum SayanVPN-arm64-debug.apk > SayanVPN-arm64-debug.apk.sha256)
          echo "APK size: $(stat -c%s build/revival/SayanVPN-arm64-debug.apk) bytes"

      - name: Upload candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: sayanvpn-revival-arm64-debug
          path: |
            build/revival/SayanVPN-arm64-debug.apk
            build/revival/SayanVPN-arm64-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
