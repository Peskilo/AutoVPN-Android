name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Debug APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Verify installable ABI APKs and write SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="app/build/outputs/apk/debug"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          shopt -s nullglob
          apks=("$apk_dir"/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            test -s "$apk"
            "$build_tools/apksigner" verify --verbose "$apk"
            size="$(stat -c%s "$apk")"
            if (( size > 150 * 1024 * 1024 )); then
              echo "::error file=$apk::APK unexpectedly exceeds 150 MiB; check ABI splitting"
              exit 1
            fi
          done
          sha256sum "${apks[@]}" | tee "$apk_dir/SHA256SUMS.txt"

      - name: Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Release AAB
        run: ./gradlew bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
